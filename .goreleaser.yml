# goreleaser — cross-compile + GitHub Release + npm publish in one command.
#
#   git tag v0.1.2 && git push --tags
#   goreleaser release --clean
#
# Requires: GITHUB_TOKEN env var with repo write permissions.
# npm is published manually after the GitHub Release assets are available.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ly
    binary: ly
    main: .
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Din-Studio/lingying-cli/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - id: ly
    name_template: "ly-{{.Version}}-{{.Os}}-{{.Arch}}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - src: LICENSE
      - src: README.md
      - src: skills/SKILL.md
        dst: skills/

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Din-Studio
    name: lingying-cli
