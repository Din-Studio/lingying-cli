# goreleaser — cross-compile + GitHub Release in one command.
#
#   git tag v0.1.6 && git push --tags
#   goreleaser release --clean
#
# Requires: GITHUB_TOKEN env var with repo write permissions.
# GitHub Actions 在本仓库不可用，发版须在本地执行。
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ly
    binary: ly
    main: .
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Din-Studio/lingying-cli/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - id: ly
    # 资产名不含版本号：latest/download/X 只是到 download/<最新tag>/X 的重定向，
    # 因此同一份文件同时服务「取最新」与「锁版本」，引导脚本无需先发现版本号。
    name_template: "ly-{{.Os}}-{{.Arch}}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - src: LICENSE
      - src: README.md
      # dst 必须是完整目标路径；写成 "skills/" 会被当作文件名，
      # 归档里会出现一个名为 skills 的文件而不是 skills/ 目录。
      - src: skills/SKILL.md
        dst: skills/SKILL.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Din-Studio
    name: lingying-cli
  # 引导脚本作为 Release 资产上传，使安装全程只使用 github.com 一个域名，
  # 彻底移除对 raw.githubusercontent.com 的依赖。
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
